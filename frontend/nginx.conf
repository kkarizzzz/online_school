server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        # index.html всегда перепроверяется — иначе после пересборки браузер держит старую версию
        add_header Cache-Control "no-cache";
    }

    # Файлы сборки с хэшем в имени не меняются — кэшируем надолго
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Нарешка пока работает на сервере концепта (concepts/tasks_page) — сервис practice в docker-compose.
    # Убрать вместе с VITE_PRACTICE_API_URL, когда API нарешки появится в основном бэкенде.
    # Через переменную и resolver: если сервиса нет, nginx всё равно стартует, а /concept-practice ответит 502.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $practice_server http://practice:8100;

    location /concept-practice/ {
        rewrite ^/concept-practice/(.*)$ /api/$1 break;
        proxy_pass $practice_server;
    }

    location /storage/ {
        proxy_pass $practice_server;
    }
}
