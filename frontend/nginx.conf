server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        # index.html всегда перепроверяется — иначе после пересборки браузер держит старую версию
        add_header Cache-Control "no-cache";
    }

    # Файлы сборки с хэшем в имени не меняются — кэшируем надолго
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Картинки к условиям заданий и фото решений отдаёт бэкенд (пока нет S3/MinIO).
    # Через переменную и resolver: если бэкенда нет, nginx всё равно стартует, а /storage ответит 502.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_server http://backend:8000;

    location /storage/ {
        proxy_pass $backend_server;
    }
}
