version: '3.8'

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      # Теперь Docker будет искать эти переменные в .env файле
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432  # внутри docker-сети порт базы 5432; в backend/.env стоит 5433 для запуска с хоста
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./backend/.env

  # Нарешка пока живёт на сервере концепта (concepts/tasks_page, FastAPI + SQLite).
  # Образ бэкенда переиспользуется ради зависимостей; убрать, когда API нарешки переедет в backend/.
  practice:
    build: ./backend
    restart: always
    working_dir: /repo/concepts/tasks_page
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8100"]
    volumes:
      - ./concepts/tasks_page:/repo/concepts/tasks_page
      - ./frontend/public/fonts:/repo/frontend/public/fonts:ro
      - ./frontend/src/shared/assets/icons:/repo/frontend/src/shared/assets/icons:ro

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - practice

volumes:
  postgres_data: