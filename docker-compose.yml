services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      # Теперь Docker будет искать эти переменные в .env файле
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432  # внутри docker-сети порт базы 5432; в backend/.env стоит 5433 для запуска с хоста
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./backend/.env
    volumes:
      # Картинки заданий и фото решений (app/services/storage.py), пока нет S3/MinIO
      - storage_data:/app/storage

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  storage_data: